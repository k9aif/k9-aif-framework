<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K9X Chat — Sign in</title>
  <style>
    :root {
      --bg: #05060a;
      --panel: #10131c;
      --panel-border: #232a3d;
      --text: #e7ebf7;
      --text-muted: #7c85a3;
      --accent: #3b82f6;
      --accent-2: #8b5cf6;
      --danger-bg: #2a1218;
      --danger-border: #7f1d2c;
      --danger-text: #fca5a5;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow field -- two slow-drifting radial gradients behind
       everything, kept purely decorative (aria-hidden) and CSS-only so
       the login page has no JS dependency before auth is established. */
    .glow {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(38rem 38rem at 18% 22%, rgba(59, 130, 246, 0.20), transparent 60%),
        radial-gradient(34rem 34rem at 82% 78%, rgba(139, 92, 246, 0.18), transparent 60%),
        radial-gradient(60rem 60rem at 50% 50%, rgba(255, 255, 255, 0.02), transparent 70%);
      animation: drift 16s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-2%, 2%, 0) scale(1.05); }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(60% 60% at 50% 40%, black, transparent 85%);
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 12px 30px -8px rgba(59, 130, 246, 0.55);
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-tag {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .panel {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
    }

    .panel h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .panel .sub {
      margin: 0 0 24px;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 16px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: #0b0e17;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: 0.85rem;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    button.submit {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px -10px rgba(59, 130, 246, 0.6);
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }

    button.submit:hover {
      box-shadow: 0 14px 30px -10px rgba(59, 130, 246, 0.75);
    }

    button.submit:active {
      transform: translateY(1px);
    }

    .footnote {
      margin-top: 20px;
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <div class="stage">
    <div class="brand">
      <div class="brand-mark">K9X</div>
      <div class="brand-name">K9X Chat</div>
      <div class="brand-tag">Built on K9-AIF Framework</div>
    </div>

    <div class="panel">
      <h1>Sign in</h1>
      <p class="sub">Restricted access — authorized use only.</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="submit" type="submit">Sign in</button>
      </form>
    </div>

    <div class="footnote">K9X Chat &middot; PowerAI-5090</div>
  </div>
</body>
</html>
