chat:
  stream: true   # config-driven — set false for non-streaming (full response) chat

evaluation:
  enabled: false          # toggle at runtime via POST /chat/evaluation/toggle
  pass_threshold: 70
  judge_model: reasoning  # model alias used as the LLM judge

internet_search:
  # Real live web search (self-hosted SearxNG), off by default --
  # SCOPE_INSTRUCTION keeps k9chat focused on K9-AIF/K9X, so a general
  # real-world question gets no live data unless this is explicitly on.
  # Every message queries SearxNG when enabled (same always-on-per-turn
  # pattern as knowledge_context) -- results are supplementary context the
  # model may or may not use, not a hard override of scope.
  enabled: false           # toggle at runtime via POST /chat/internet-search/toggle
  base_url: "${K9CHAT_SEARXNG_URL:-http://localhost:7070}"
  top_k: 5

correction_learning:
  # Auto-detects when a user's next message corrects something the
  # assistant just said, then writes the corrected fact straight into the
  # shared knowledge base (k9x_knowledge_base) for future retrieval -- no
  # review queue. Safe only because this k9chat instance is single-user/
  # internal (home network, no public exposure) -- every "visitor" is the
  # same trusted person on a different device. Auto-merge without a review
  # step would be a real corpus-poisoning risk on a publicly-hosted,
  # no-password k9chat; revisit before ever exposing this instance beyond
  # the home network.
  enabled: true            # toggle at runtime via POST /chat/learning/toggle
  judge_model: reasoning   # model alias used to detect + extract corrections

faq_shortcut:
  # Demonstrates a real retrieve-then-rerank NLP pattern: when the top
  # knowledge-base hit is a curated FAQ/glossary entry AND a cross-encoder
  # reranker (faq_reranker.py, CPU-only, sentence-transformers) scores it
  # as a confident direct answer, that stored text is returned verbatim --
  # no LLM call, zero hallucination risk for that class of question.
  # Threshold empirically calibrated (2026-09-20): genuine FAQ/glossary
  # matches scored 4.0-10.4, off-topic/wrong-chunk queries scored -11.4 to
  # -6.3 against the real corpus -- 3.5 sits with safe margin on both sides.
  enabled: true          # toggle at runtime via POST /chat/faq-shortcut/toggle
  score_threshold: 3.5
  sources: [k9chat/faq, k9chat/glossary]

guardrails:
  enabled: false   # set true once the guardian model below is pulled
  model_alias: guardian
  fail_closed: false   # if the guardian call errors, allow the message through (true = block)
  refusal_message: "I can't help with that request."

inference:

  router:
    type: k9

  llm_factory:
    provider: ollama
    base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"

    models:
      general: "${K9CHAT_GENERAL_MODEL:-qwen3.8:27b}"
      # Dict form (not a bare string) so llm_factory.py's `think` passthrough
      # applies -- reasoning is used by Eval's judge and correction_learner's
      # detection call, both classification/judgment tasks that benefit from
      # the model's hybrid thinking phase. Not set on `general` above: that
      # would add thinking-phase latency to every ordinary chat reply too.
      reasoning:
        model: "${K9CHAT_REASONING_MODEL:-qwen3.8:27b}"
        think: true
      guardian: "${K9CHAT_GUARDIAN_MODEL:-granite3-guardian:2b}"

  model_catalog:
    default_model: general

    models:
      general:
        provider: ollama
        llm_ref: general
        capabilities: [chat]
      reasoning:
        provider: ollama
        llm_ref: reasoning
        capabilities: [reasoning]
      guardian:
        provider: ollama
        llm_ref: guardian
        capabilities: [guardrails]

# Per-project file storage for the Projects feature (project_retriever.py).
# ChromaDB is embedded/local (persists under ./​.chroma, no external server)
# -- fits this example's "lightweight" framing better than standing up a
# separate vector DB just for file context. One collection per project,
# not a shared collection filtered by metadata -- see project_retriever.py
# for why (real cross-project leakage risk otherwise).
vectordb:
  provider: chromadb
  path: "${K9CHAT_CHROMA_PATH:-./.chroma}"
  embedding_provider: ollama
  embedding_model: "${K9CHAT_EMBEDDING_MODEL:-nomic-embed-text}"
  embedding_endpoint: "${OLLAMA_BASE_URL:-http://localhost:11434}"

# Project metadata (name, instructions, file list) -- see project_manager.py.
# db_path defaults to k9chat_projects.db alongside this config file if
# omitted here.
projects:
  db_path: "${K9CHAT_PROJECTS_DB:-}"