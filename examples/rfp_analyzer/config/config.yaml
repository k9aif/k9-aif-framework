app:
  name: RFP Analyzer
  description: Large document processing with OOB RAG pipeline

inference:
  llm_factory:
    base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
    models:
      general:
        model: "llama3.2:1b"
        temperature: 0.3
        max_tokens: 2048
      reasoning:
        model: "granite3-dense:2b"
        temperature: 0.2
        max_tokens: 4096
  model_catalog:
    models:
      general:
        provider: ollama
        llm_ref: general
        capabilities: [general, chat, summarization]
        latency_tier: realtime
        cost_tier: minimal
      reasoning:
        provider: ollama
        llm_ref: reasoning
        capabilities: [reasoning, analysis, extraction]
        latency_tier: interactive
        cost_tier: standard

vectordb:
  provider: chromadb
  path: ./data/vectors
  collection: rfp_chunks
  embedding_provider: ollama
  embedding_model: nomic-embed-text

security:
  # k9x_Shield: built into every agent by the framework (governance by
  # construction, k9-aif >= 1.15). Same profile as DAS: block known injection
  # phrases and oversized input; personal data is flagged, not blocked.
  shield:
    enabled: true
    strict: false
    fail_open: true
    ingress:
      checks: [InputSizeCheck, PromptInjectionCheck, PIIBoundaryCheck]
    egress:
      checks: [PIIBoundaryCheck]
    check_config:
      InputSizeCheck:
        max_chars: 250000
