# K9-AIF Weather Assist (CrewAI Integration) — config

# LLM backend. Credentials/host details live in .env (see env-example);
# this file only references them via ${VAR:-default} expansion.
ollama:
  base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
  model: "${OLLAMA_MODEL:-llama3.2:1b}"

# What K9CrewAIAdapter's execute_flow() enforces on every call is built by the
# framework from this file (governance_from_config, k9-aif >= 1.15):
# security.shield below -> ShieldGovernance (raises PermissionError on a BLOCK);
# governance.guardian -> Granite Guardian after Shield. See k9/governance.py.
governance:
  # Granite Guardian: semantic screening after Shield (k9-aif >= 1.15 builds
  # ChainedGovernance(Shield, Guardian) for every agent). Needs the model in Ollama:
  #   ollama pull granite4.1-guardian:8b
  # fail_closed: if Guardian is unreachable, requests are refused, not passed unscreened.
  guardian:
    enabled: true
    model: granite4.1-guardian:8b
    on_unavailable: fail_closed

# Checks appropriate to a weather query/response — deliberately lighter than
# a PII- or document-heavy domain like EOC's, since weather queries carry no
# sensitive data. This is a real, enforced pipeline, not illustrative
# configuration: ShieldGovernance raises PermissionError on BLOCK.
security:
  shield:
    enabled: true
    strict: false
    ingress:
      checks:
        - PromptInjectionCheck
    egress:
      checks:
        - OutputSanitizationCheck
