<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K9-AIF Runtime Graph — Full Screen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
  :root {
    --bg-base:     #060b18;
    --bg-surface:  #0d1424;
    --border:      #1c3050;
    --text-primary:#e8f0fe;
    --text-muted:  #6a8aaa;
    --blue:        #0f62fe;
    --blue-lt:     #4589ff;
    --green-lt:    #42be65;
  }
  html, body { margin: 0; height: 100%; background: var(--bg-base); color: var(--text-primary);
               font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden; }
  .toolbar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
             border-bottom: 1px solid var(--border); background: var(--bg-surface); }
  .toolbar a { color: var(--blue-lt); text-decoration: none; font-size: 12px; }
  .toolbar a:hover { text-decoration: underline; }
  .view-btns { display: flex; gap: 6px; margin-left: 16px; }
  .gview-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted);
               padding: 6px 12px; border-radius: 5px; font-size: 12px; cursor: pointer; }
  .gview-btn.active { border-color: var(--blue-lt); color: var(--text-primary); background: rgba(69,137,255,0.12); }
  .source-badge { margin-left: auto; font-size: 11px; color: var(--text-muted); font-family: monospace; }
  #graph-container { position: absolute; top: 52px; left: 0; right: 0; bottom: 32px; }
  #graph-legend { position: absolute; bottom: 0; left: 0; right: 0; height: 32px; display: flex;
                  align-items: center; gap: 16px; padding: 0 16px; border-top: 1px solid var(--border);
                  background: var(--bg-surface); font-size: 11px; color: var(--text-muted); }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid; }
  .empty-msg { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.8; }
</style>
</head>
<body>

<div class="toolbar">
  <strong>K9-AIF Runtime Graph</strong>
  <div class="view-btns">
    <button class="gview-btn" data-view="architecture" onclick="setView('architecture', this)">🏗 Architecture</button>
    <button class="gview-btn" data-view="entities" onclick="setView('entities', this)">🕸 Claimant Network</button>
    <button class="gview-btn" data-view="fraud_network" onclick="setView('fraud_network', this)">🚨 Fraud Network</button>
  </div>
  <span class="source-badge" id="graph-source-badge"></span>
  <a href="javascript:window.close()">✕ Close</a>
</div>

<div id="graph-container"></div>
<div id="graph-legend"></div>

<script>
'use strict';

// Same palette/legend data as webui/app.js's Runtime Graph tab -- kept
// in sync manually since this is a standalone page (no shared bundle).
const GRAPH_STYLES = {
  architecture: {
    router:          { bg: 'rgba(69,137,255,0.2)',   border: '#4589ff', shape: 'diamond' },
    orchestrator:    { bg: 'rgba(165,110,255,0.2)',  border: '#a56eff', shape: 'rectangle' },
    agent:           { bg: 'rgba(51,177,255,0.15)',  border: '#33b1ff', shape: 'ellipse' },
    governanceagent: { bg: 'rgba(241,194,27,0.15)',  border: '#f1c21b', shape: 'ellipse' },
    governance:      { bg: 'rgba(241,194,27,0.15)',  border: '#f1c21b', shape: 'ellipse' },
    audit:           { bg: 'rgba(66,190,101,0.15)',  border: '#42be65', shape: 'ellipse' },
    squad:           { bg: 'rgba(0,180,216,0.12)',   border: '#00b4d8', shape: 'rectangle' },
    conditional:     { bg: 'rgba(255,131,43,0.12)',  border: '#ff832b', shape: 'ellipse' },
    input:           { bg: 'rgba(69,137,255,0.08)',  border: '#3b5fc0', shape: 'ellipse' },
    output:          { bg: 'rgba(36,161,72,0.12)',   border: '#24a148', shape: 'ellipse' },
  },
  entities: {
    claimant: { bg: 'rgba(51,177,255,0.2)',   border: '#33b1ff', shape: 'ellipse' },
    claim:    { bg: 'rgba(69,137,255,0.2)',   border: '#4589ff', shape: 'rectangle' },
    policy:   { bg: 'rgba(165,110,255,0.2)',  border: '#a56eff', shape: 'diamond' },
    document: { bg: 'rgba(66,190,101,0.15)',  border: '#42be65', shape: 'triangle' },
    alert:    { bg: 'rgba(218,30,40,0.2)',    border: '#da1e28', shape: 'star' },
  },
  fraud_network: {
    claimant: { bg: 'rgba(51,177,255,0.2)',   border: '#33b1ff', shape: 'ellipse' },
    claim:    { bg: 'rgba(69,137,255,0.2)',   border: '#4589ff', shape: 'rectangle' },
    policy:   { bg: 'rgba(165,110,255,0.2)',  border: '#a56eff', shape: 'diamond' },
  },
};

const GRAPH_LEGENDS = {
  architecture: [
    { color: '#4589ff', bg: 'rgba(69,137,255,0.2)',   label: 'Router' },
    { color: '#a56eff', bg: 'rgba(165,110,255,0.2)',  label: 'Orchestrator' },
    { color: '#33b1ff', bg: 'rgba(51,177,255,0.15)',  label: 'Agent' },
    { color: '#f1c21b', bg: 'rgba(241,194,27,0.15)',  label: 'Governance' },
    { color: '#42be65', bg: 'rgba(66,190,101,0.15)',  label: 'Audit' },
  ],
  entities: [
    { color: '#33b1ff', bg: 'rgba(51,177,255,0.2)',   label: 'Claimant' },
    { color: '#4589ff', bg: 'rgba(69,137,255,0.2)',   label: 'Claim' },
    { color: '#a56eff', bg: 'rgba(165,110,255,0.2)',  label: 'Policy' },
    { color: '#42be65', bg: 'rgba(66,190,101,0.15)',  label: 'Document' },
    { color: '#da1e28', bg: 'rgba(218,30,40,0.2)',    label: 'Alert' },
  ],
  fraud_network: [
    { color: '#33b1ff', bg: 'rgba(51,177,255,0.2)',   label: 'Claimant' },
    { color: '#4589ff', bg: 'rgba(69,137,255,0.2)',   label: 'Claim' },
    { color: '#a56eff', bg: 'rgba(165,110,255,0.2)',  label: 'Policy' },
    { color: '#da1e28', bg: 'rgba(218,30,40,0.2)',    label: 'High-risk Policy (⚠ multi-claim)' },
  ],
};

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getView() {
  const params = new URLSearchParams(window.location.search);
  return params.get('view') || 'architecture';
}

function setView(view, btn) {
  const url = new URL(window.location);
  url.searchParams.set('view', view);
  window.history.replaceState({}, '', url);
  document.querySelectorAll('.gview-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  loadGraphView(view);
}

async function loadGraphView(view) {
  const container = document.getElementById('graph-container');
  container.innerHTML = '<div class="empty-msg">Loading graph from Neo4j…</div>';

  let data;
  try {
    const r = await fetch(`/api/eoc/graph?view=${view}`);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    data = await r.json();
  } catch (e) {
    container.innerHTML = `<div class="empty-msg">Graph error: ${esc(e.message)}</div>`;
    return;
  }

  const badge = document.getElementById('graph-source-badge');
  badge.textContent = data.source === 'neo4j' ? '● Neo4j' : data.source === 'static' ? '○ static' : '✗ error';
  badge.style.color = data.source === 'neo4j' ? 'var(--green-lt)' : 'var(--text-muted)';

  if (data.empty || !data.nodes?.length) {
    const hint = view === 'architecture'
      ? 'Run the seed: <code>ubuntu/build-run.sh seed-neo4j</code>'
      : 'Run a few scenarios first — GraphSyncAgent will write entity nodes to Neo4j.';
    container.innerHTML = `<div class="empty-msg">No ${view.replace('_',' ')} data in Neo4j yet.<br>
      <span style="font-size:11px">${hint}</span></div>`;
    return;
  }

  renderCytoscape(container, data, view);
  renderLegend(view);
}

function renderCytoscape(container, data, view) {
  container.innerHTML = '';
  const palette = GRAPH_STYLES[view] || GRAPH_STYLES.architecture;

  const cy = cytoscape({
    container,
    elements: [
      ...data.nodes.map(n => ({ data: { ...n } })),
      ...data.edges.map(e => ({ data: { ...e } })),
    ],
    style: [
      {
        selector: 'node',
        style: {
          'label':            'data(label)',
          'color':            '#e8f0fe',
          'font-size':        11,
          'font-family':      'IBM Plex Mono, monospace',
          'text-valign':      'bottom',
          'text-halign':      'center',
          'text-margin-y':    8,
          'text-wrap':        'wrap',
          'text-max-width':   110,
          'width':            64,
          'height':           64,
          'background-color': '#1d2f56',
          'border-color':     '#3b5fc0',
          'border-width':     2,
        }
      },
      ...Object.entries(palette).map(([type, s]) => ({
        selector: `node[type="${type}"]`,
        style: {
          'background-color': s.bg,
          'border-color':     s.border,
          'shape':            s.shape || 'ellipse',
        }
      })),
      {
        selector: 'node[risk="high"]',
        style: {
          'border-color': '#da1e28',
          'border-width':  3,
          'background-color': 'rgba(218,30,40,0.18)',
        }
      },
      {
        selector: 'edge',
        style: {
          'width':               1.8,
          'line-color':          '#2d4070',
          'target-arrow-color':  '#4589ff',
          'target-arrow-shape':  'triangle',
          'curve-style':         'bezier',
          'label':               'data(label)',
          'font-size':           9,
          'color':               '#3b5fc0',
          'font-family':         'IBM Plex Mono, monospace',
          'text-rotation':       'autorotate',
          'opacity':             0.85,
        }
      },
      {
        selector: 'node:selected',
        style: { 'border-width': 3, 'border-color': '#ffffff', 'z-index': 10 }
      },
    ],
    layout: view === 'architecture'
      ? { name: 'breadthfirst', directed: true, padding: 60, spacingFactor: 1.8, avoidOverlap: true }
      : { name: 'cose', padding: 70, nodeRepulsion: 9000, idealEdgeLength: 150,
          edgeElasticity: 100, gravity: 0.4, animate: true, animationDuration: 500,
          fit: true, randomize: false },
    userZoomingEnabled: true,
    userPanningEnabled: true,
  });

  cy.on('tap', 'node', (evt) => {
    cy.animate({ zoom: Math.min(cy.zoom() * 1.6, 3), center: { eles: evt.target } }, { duration: 280 });
  });
  cy.on('tap', (evt) => {
    if (evt.target === cy) cy.fit(undefined, 40);
  });
}

function renderLegend(view) {
  const el = document.getElementById('graph-legend');
  const items = GRAPH_LEGENDS[view] || [];
  el.innerHTML = items.map(item =>
    `<div class="legend-item">
       <div class="legend-dot" style="border-color:${item.color};background:${item.bg}"></div>
       ${esc(item.label)}
     </div>`).join('');
}

// Bootstrap
const initialView = getView();
document.querySelectorAll('.gview-btn').forEach(b => {
  if (b.dataset.view === initialView) b.classList.add('active');
});
loadGraphView(initialView);
</script>

</body>
</html>
