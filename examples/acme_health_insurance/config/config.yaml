# Acme Health Insurance Experience Center — Configuration

inference:
  llm_factory:
    backend: ollama
    provider: "ollama"
    base_url: "http://192.168.1.244:11434"
    models:
      guardian: "granite3-guardian:latest"
      code: "granite3-dense:2b"
      general: "llama3.2:1b"

  router:
    type: k9_model_router
    default_model: general

  models:
    general:
      provider: ollama
      llm_ref: general
      capabilities: [general, chat, reasoning]

    guardian:
      provider: ollama
      llm_ref: guardian
      capabilities: [guardrails, policy, confidential]

    code:
      provider: ollama
      llm_ref: code
      capabilities: [code, structured_output]

retriever:
  sources:
    - name: acme_vector
      type: vector
      enabled: true
      store: chromadb
      collection: acme_health_knowledge

    - name: acme_sql
      type: sql
      enabled: true
      db: acme_db
      table: PLAN_MASTER

    - name: acme_text
      type: file
      enabled: true
      path: "./examples/acme_health_insurance/data/knowledge/"

agents:
  eligibility_agent:
    model: "general"

  claim_processing_agent:
    model: "general"

  policy_advisor_agent:
    model: "guardian"

  notification_agent:
    model: "code"

  monitor_agent:
    model: "guardian"

monitoring:
  console: true
  log_level: INFO

logging:
  level: DEBUG
  color: true
  dir: logs/acme_health_insurance

persistence:
  db_path: examples/acme_health_insurance/acme_health_insurance.db

messaging:
  backend: kafka
  brokers:
    - 192.168.1.244:9092
  topic: acme-events
  client_id: acme-console
  security_protocol: PLAINTEXT

governance:
  enabled: true
  policy_path: k9_aif_abb/policies/governance.yaml

flows:
  path: examples/acme_health_insurance/config/flows.yaml

security:
  # k9x_Shield: built into every agent by the framework (governance by
  # construction, k9-aif >= 1.15). Same profile as DAS: block known injection
  # phrases and oversized input; personal data is flagged, not blocked.
  shield:
    enabled: true
    strict: false
    fail_open: true
    ingress:
      checks: [InputSizeCheck, PromptInjectionCheck, PIIBoundaryCheck]
    egress:
      checks: [PIIBoundaryCheck]
    check_config:
      InputSizeCheck:
        max_chars: 250000
